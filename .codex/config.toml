# hplan_codex — Codex CLI configuration

[agents]
max_threads = 6
max_depth = 2

[project]
doc_max_bytes = 65536
doc_fallback_filenames = ["AGENTS.md"]

[sandbox]
# default: workspace-write (can read/write project files + run bash)
# For UI validation tasks, set to: workspace-write
default_sandbox_mode = "workspace-write"
